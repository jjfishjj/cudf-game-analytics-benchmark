[project]
name = "cudf-game-analytics-benchmark"
version = "1.0.0"
description = "Reproducible pandas and cuDF analytics benchmark"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.4",
  "pandas==3.0.0",
]

[project.optional-dependencies]
gpu = [
  "cudf-cu12==26.10.2",
]
dev = [
  "jsonschema==4.25.1",
  "pytest==8.4.2",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
